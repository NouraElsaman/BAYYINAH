name: Deploy

on:
  push:
    branches: [main]

# Render auto-deploys when connected to the GitHub repo via dashboard.
# This workflow is a fallback to trigger deploys via deploy hooks.
# To enable: set RENDER_BACKEND_DEPLOY_HOOK and RENDER_FRONTEND_DEPLOY_HOOK
# in GitHub Settings -> Secrets -> Actions.

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK != '' }}
    steps:
      - name: Trigger Render backend deploy
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK != '' }}
    steps:
      - name: Trigger Render frontend deploy
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"