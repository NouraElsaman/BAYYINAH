name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings pytest pytest-asyncio pytest-mock \
            qdrant-client langgraph langchain-core groq openai httpx rank_bm25 \
            redis prometheus-client python-multipart

      - name: Run unit tests (excluding integration)
        run: pytest tests/ -v --ignore=tests/test_integration.py -m "not integration"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit || true

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t bayyinah-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t bayyinah-frontend:ci ./frontend --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000
