name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install \
            "pytest==8.3.5" \
            "pytest-asyncio==0.23.8" \
            "pytest-mock==3.15.1"

      - name: Show installed test-relevant packages
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== Test package versions ==="
          pip show pytest pytest-asyncio anyio | grep -E "^(Name|Version):"
          echo "=== pytest.ini contents ==="
          cat pytest.ini
          echo "=== conftest.py first 30 lines ==="
          head -30 tests/conftest.py

      - name: Test collection only
        run: python -m pytest tests/ -m "not integration" --co -q 2>&1
        continue-on-error: true

      - name: Run unit tests
        run: python -m pytest tests/ -m "not integration" --tb=long -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t bayyinah-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t bayyinah-frontend:ci ./frontend --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000