name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install \
            "pytest==8.3.5" \
            "pytest-asyncio==0.23.8" \
            "pytest-mock==3.15.1"

      - name: Run unit tests (capture output)
        run: |
          set +e
          python -m pytest tests/ -v -m "not integration" --tb=long \
            2>&1 | tee /tmp/pytest_output.txt
          PYTEST_EXIT=$?
          echo "PYTEST_EXIT_CODE=$PYTEST_EXIT" >> $GITHUB_ENV
          echo "=== LAST 100 LINES OF PYTEST OUTPUT ==="
          tail -100 /tmp/pytest_output.txt
          echo "=== END ==="
          exit $PYTEST_EXIT

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /tmp/pytest_output.txt
          retention-days: 1

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t bayyinah-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t bayyinah-frontend:ci ./frontend --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000