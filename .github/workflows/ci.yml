name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          pip install \
            "pytest==9.1.1" \
            "pytest-asyncio==1.4.0" \
            "pytest-mock==3.15.1"

      - name: Show installed package versions
        run: |
          python -c "
          import importlib.metadata as m
          for pkg in ['pytest', 'pytest-asyncio', 'anyio', 'torch', 'sentence-transformers', 'FlagEmbedding']:
              try:
                  print(f'{pkg}: {m.version(pkg)}')
              except Exception as e:
                  print(f'{pkg}: not found')
          "

      - name: Test collection (dry run)
        run: |
          pytest tests/ --collect-only -q -m "not integration"
          echo "Collection exit code: $?"

      - name: Run first 5 tests only (isolation)
        run: |
          pytest tests/test_adaptive_reranking.py -v --tb=long 2>&1 || true
          echo "---"
          pytest tests/test_answer_synthesis.py -v --tb=long 2>&1 || true
          echo "---"
          pytest tests/test_chat_memory.py -v --tb=long 2>&1 || true

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v -m "not integration" --tb=long 2>&1
          echo "Pytest exit: $?"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t bayyinah-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t bayyinah-frontend:ci ./frontend --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000