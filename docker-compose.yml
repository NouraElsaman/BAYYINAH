version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: bayyinah-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bayyinah-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bayyinah-backend
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # HF_HOME is set in Dockerfile; override here if needed for local dev.
      # The hf_cache volume persists downloaded models across docker compose restarts.
      HF_HOME: /data/hf_cache
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis
    volumes:
      - uploads_data:/data/uploads
      - hf_cache_data:/data/hf_cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: bayyinah-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  uploads_data:
  # hf_cache_data: named volume so BGE-M3 + reranker models (~11.3GB) are
  # downloaded once and reused across docker compose restarts.
  hf_cache_data: